<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chronos</title>
  <meta name="description" content="Gestión de obras: fotos, comentarios, recordatorios, PDFs y enlaces." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="iconbtn" hidden aria-label="Volver">&#8249;</button>
    <h1 id="pageTitle">Chronos</h1>
    <div class="spacer"></div>
    <button id="searchBtn" class="iconbtn" aria-label="Buscar">&#9906;</button>
    <button id="syncBtn" class="iconbtn" aria-label="Sincronizar con Drive" hidden>☁</button>
    <button id="menuBtn" class="iconbtn" aria-label="Ajustes">&#8942;</button>
  </header>

  <div id="searchBar" class="searchbar" hidden>
    <input id="searchInput" type="search" placeholder="Buscar obra, cliente, comentario…" autocomplete="off" />
  </div>

  <main id="view" class="view">
    <div class="empty"><p>Cargando…</p></div>
  </main>

  <nav class="tabbar">
    <button class="tab" data-nav="#/">Obras</button>
    <button class="tab" data-nav="#/recordatorios">Recordatorios</button>
    <button class="tab" data-nav="#/inbox">Recibidos</button>
  </nav>

  <button id="fab" class="fab" hidden aria-label="Añadir">+</button>
  <div id="modalRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
